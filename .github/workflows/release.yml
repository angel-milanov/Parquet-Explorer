name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  distributions:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  standalone:
    name: standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: parquet-explorer-linux-x86_64
          - os: windows-latest
            asset: parquet-explorer-windows-x86_64
          - os: macos-latest
            asset: parquet-explorer-macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Build standalone binary
        run: uv run pyinstaller --noconfirm --clean packaging/parquet-explorer.spec

      - name: Smoke test the binary
        shell: bash
        # --version loads DuckDB and Qt to report their versions, so this fails
        # loudly if either failed to make it into the bundle.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BINARY=./dist/parquet-explorer/parquet-explorer.exe
          else
            BINARY=./dist/parquet-explorer/parquet-explorer
          fi
          "$BINARY" --version | tee version.txt
          grep -q "DuckDB" version.txt
          grep -q "Qt" version.txt

      - name: Package archive
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.asset }}.zip" parquet-explorer
          else
            tar czf "../${{ matrix.asset }}.tar.gz" parquet-explorer
          fi

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build installer
        if: runner.os == 'Windows'
        # The bundle was built and smoke-tested above, so reuse it.
        run: uv run python packaging/build_installer.py --skip-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.tar.gz
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [distributions, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            artifacts/*

  pypi:
    name: publish to PyPI
    needs: [release]
    # Enable by setting the repository variable PUBLISH_TO_PYPI to "true" once
    # trusted publishing is configured for this project on PyPI.
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish
        run: uv publish --trusted-publishing always
