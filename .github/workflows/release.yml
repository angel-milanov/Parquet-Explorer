name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  distributions:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  standalone:
    name: standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: parquet-explorer-linux-x86_64
          - os: windows-latest
            asset: parquet-explorer-windows-x86_64
          - os: macos-latest
            asset: parquet-explorer-macos-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync

      - name: Build standalone binary
        run: uv run pyinstaller --noconfirm --clean packaging/parquet-explorer.spec

      - name: Smoke test the binary
        shell: bash
        # --version loads DuckDB and Qt to report their versions, so this fails
        # loudly if either failed to make it into the bundle.
        #
        # The Windows exe is a GUI program, which is why this step must stay on
        # `shell: bash` and keep the pipe: bash waits for the process and the pipe
        # gives its output somewhere to land.  Rewriting this in PowerShell, or
        # dropping the `| tee`, would silently capture nothing.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BINARY=./dist/parquet-explorer/parquet-explorer.exe
          else
            BINARY=./dist/parquet-explorer/parquet-explorer
          fi
          "$BINARY" --version | tee version.txt
          grep -q "DuckDB" version.txt
          grep -q "Qt" version.txt

      - name: Check the Windows exe opens no console
        if: runner.os == 'Windows'
        shell: bash
        # The step above passes either way, so assert the PE subsystem byte itself:
        # 2 is WINDOWS_GUI, 3 is WINDOWS_CUI and would put a console window back on
        # every launch.
        run: |
          uv run python - ./dist/parquet-explorer/parquet-explorer.exe <<'PY'
          import struct, sys

          header = open(sys.argv[1], "rb").read(0x400)
          pe = struct.unpack_from("<I", header, 0x3C)[0]
          subsystem = struct.unpack_from("<H", header, pe + 24 + 68)[0]
          if subsystem != 2:
              sys.exit(f"expected a GUI executable (subsystem 2), got {subsystem}")
          print("subsystem 2 (WINDOWS_GUI) — no console on launch")
          PY

      - name: Package archive
        shell: bash
        # Everything to be released is gathered in release/: upload-artifact roots
        # an artifact at the common ancestor of its paths, so mixing directories
        # here would nest the installers inside the downloaded artifact and leave
        # `gh release create` pointed at a directory rather than a file.
        run: |
          mkdir -p release
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../release/${{ matrix.asset }}.zip" parquet-explorer
          else
            tar czf "../release/${{ matrix.asset }}.tar.gz" parquet-explorer
          fi

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        # The bundle was built and smoke-tested above, so reuse it.
        run: |
          uv run python packaging/build_installer.py --skip-bundle
          cp dist/*-setup.exe release/

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv run python packaging/build_dmg.py --skip-bundle
          cp dist/*.dmg release/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release/
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [distributions, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            artifacts/*

  pypi:
    name: publish to PyPI
    needs: [release]
    # Enable by setting the repository variable PUBLISH_TO_PYPI to "true" once
    # trusted publishing is configured for this project on PyPI.
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish
        run: uv publish --trusted-publishing always
