name: Feature request
description: Suggest something Parquet Explorer should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation you're in, not just the feature you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, other tools, or SQL you write by hand.
