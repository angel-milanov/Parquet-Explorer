[project]
name = "parquet-explorer"
version = "0.1.0"
description = "An advanced desktop explorer for Parquet files — browse schemas and metadata, run DuckDB SQL, and page through results in a fast data grid."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Angel Milanov", email = "a.milanov@key.dev" }
]
keywords = ["parquet", "duckdb", "sql", "qt", "gui", "data", "explorer"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: SQL",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.1",
    "pyside6>=6.7",
]

[project.urls]
Homepage = "https://github.com/angel-milanov/parquet-explorer"
Repository = "https://github.com/angel-milanov/parquet-explorer"
Issues = "https://github.com/angel-milanov/parquet-explorer/issues"
Changelog = "https://github.com/angel-milanov/parquet-explorer/blob/main/CHANGELOG.md"

[project.scripts]
parquet-explorer = "parquet_explorer.app:main"

[project.gui-scripts]
parquet-explorer-gui = "parquet_explorer.app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "poethepoet>=0.29",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
package = [
    "pyinstaller>=6.10",
]
docs = [
    # MkDocs 2.0 removes the plugin system and the theming system Material relies
    # on, with no migration path -- stay on 1.x until Material supports it.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
]

[tool.uv]
# `uv sync` gives you everything needed to run, test and package the app.
# CI's test matrix trims the packaging tools with `--no-group package`; the docs
# workflow asks for the docs group explicitly.
default-groups = ["dev", "package"]

# Packaging commands, run as `uv run poe <task>`; `uv run poe` lists them.
# The everyday tools are invoked directly -- `uv run pytest`, `uv run ruff check .`
# and so on -- since wrapping a one-word command buys nothing.
[tool.poe.tasks]
icon = { cmd = "python packaging/make_icon.py", help = "Regenerate packaging/icon.ico" }
bundle = { cmd = "pyinstaller --noconfirm --clean packaging/parquet-explorer.spec", help = "Build the standalone bundle into dist/" }
installer = { cmd = "python packaging/build_installer.py", help = "Build the Windows installer (Inno Setup); implies bundle" }
docs = { cmd = "mkdocs serve", help = "Serve the documentation site with live reload" }
docs-build = { cmd = "mkdocs build --strict", help = "Build the documentation site into site/" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gui: tests that construct Qt widgets (need a display or offscreen platform)",
]
filterwarnings = ["error::DeprecationWarning:parquet_explorer.*"]

[tool.coverage.run]
source = ["parquet_explorer"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "B008",     # function call in default argument (common in Qt code)
    "RUF001",   # "ambiguous" unicode in UI strings (× and · are deliberate)
    "RUF002",   # same, in docstrings
    "RUF012",   # mutable class attrs need ClassVar (noisy with Qt)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
files = ["src/parquet_explorer"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
